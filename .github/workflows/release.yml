# Publish both packages to PyPI on a version tag (e.g. v0.3.0).
#
# One-time setup on pypi.org (per project, Publishing -> "Add a new publisher"):
#   owner: Kcodess2807   repo: graphsight   workflow: release.yml   environment: pypi
# After that, no API tokens anywhere — PyPI trusts this workflow via OIDC.
name: release

on:
  push:
    tags: ["v*"]

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write # OIDC for PyPI trusted publishing
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: run tests first
        run: |
          pip install -e ./graphsight-langgraph -e ./graphsight
          pip install pytest langgraph typing_extensions
          pytest graphsight-langgraph/tests graphsight/tests -q

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: build UI and bundle into the viewer
        run: |
          cd frontend && npm ci && npm run build && cd ..
          rm -rf graphsight/graphsight/dist
          cp -r frontend/dist graphsight/graphsight/dist

      - name: build wheels
        run: |
          pip install build twine
          python -m build ./graphsight-langgraph -o dist/
          python -m build ./graphsight -o dist/
          twine check dist/*

      - name: publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist/
