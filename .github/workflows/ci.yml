name: ci

on:
  push:
    branches: [main, graphsight]
  pull_request:

jobs:
  python-tests:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: install packages + test deps
        run: |
          pip install -e ./graphsight-langgraph -e ./graphsight
          pip install pytest langgraph typing_extensions
      - name: run tests
        run: pytest graphsight-langgraph/tests graphsight/tests -q

  # The graph engine (graphsight-memory) and the backend tests that need only it.
  # No torch or spacy: every test stubs the embedder, so no model is downloaded.
  engine-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: install engine test deps
        run: pip install -e ./graphsight-memory pytest tqdm
      - name: run graphsight-memory tests
        run: pytest -q graphsight-memory/tests
      # named explicitly: the rest of backend/tests needs the full API stack
      - name: run engine tests
        run: >
          pytest -q
          tests/test_recency.py
          tests/test_router_scoring.py
          tests/test_github_graph.py
          tests/test_eval_grading.py
          tests/test_db_integration.py
          tests/test_memory.py
          tests/test_ingest_github_wiring.py
        working-directory: backend

  frontend-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - run: npm run build
        working-directory: frontend
