# Local stack: Postgres (chat history) + the API. Copy .env.example -> .env first.
#
#   docker compose up --build
#
# The image copies backend/ flat into WORKDIR, hence `uvicorn api:app`.
# The multi-tenant stack (Redis, Celery worker + beat) lives on the
# saas-control-plane branch.

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: tracerag
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-tracerag}
      POSTGRES_DB: tracerag
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tracerag"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    image: tracerag-backend:latest
    command: ["uvicorn", "api:app", "--host", "0.0.0.0", "--port", "8000"]
    environment:
      APP_DATABASE_URL: postgresql://tracerag:${POSTGRES_PASSWORD:-tracerag}@db:5432/tracerag
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      GROQ_API_KEY: ${GROQ_API_KEY:-}
      CLERK_ISSUER: ${CLERK_ISSUER:-}
      CORS_ORIGINS: ${CORS_ORIGINS:-*}
      SENTRY_DSN: ${SENTRY_DSN:-}
    ports:
      - "8000:8000"
    depends_on:
      db: {condition: service_healthy}

volumes:
  postgres_data:
